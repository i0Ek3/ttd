[semantic_release]
version_variables = ["version.py:__version__"]
major_on_zero = false
commit_message = "chore(release): bump version {version}"
tag_format = "v{version}"

[semantic_release.commit_parser_options]
allowed_tags = ["feat", "fix", "perf", "refactor", "docs", "style", "test", "build", "ci", "chore"]
minor_tags = ["feat"]
patch_tags = ["fix", "perf", "refactor", "chore", "ci", "build"]

[semantic_release.branches.main]
match = "main"
prerelease = false

[semantic_release.branches.master]
match = "master"
prerelease = false