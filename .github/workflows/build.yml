name: Package TTD
on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  check-commit:
    name: Check Commit Message & Calc SemVer
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
      new_version: ${{ steps.semver.outputs.new_version }}
      current_version: ${{ steps.semver.outputs.current_version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Check commit message
        id: check
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          EVENT: ${{ github.event_name }}
        run: |
          FIRST_LINE=$(printf '%s' "$COMMIT_MSG" | head -n1)
          echo "Commit message: $FIRST_LINE"

          PATTERN='^(feat|fix|perf|refactor|style|build|ci|chore)(\([^)]*\))?!?:'

          # Skip the bot's own version-bump commit
          if [[ "$FIRST_LINE" == chore\(release\)* ]]; then
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            echo "⏭️ Skipping: release commit pushed by the bot itself"
          elif [[ "$EVENT" == "workflow_dispatch" ]] || [[ "$FIRST_LINE" =~ $PATTERN ]]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "✅ Build triggered"
          else
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            echo "⏭️ Skipping: commit message is not a conventional commit"
          fi

      - name: Set up Python
        if: steps.check.outputs.should_build == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install python-semantic-release
        if: steps.check.outputs.should_build == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install python-semantic-release

      - name: Calculate next semantic version
        id: semver
        if: steps.check.outputs.should_build == 'true'
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -e
          CURRENT=$(python -c "from version import __version__; print(__version__)")
          echo "current_version=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "Current baseline version: $CURRENT"

          FLAGS="--print --no-commit --no-tag --no-changelog --no-vcs-release --skip-build"
          # Manual runs always force at least a patch bump
          if [[ "$EVENT" == "workflow_dispatch" ]]; then
            FLAGS="--patch $FLAGS"
          fi

          # stdout = version number only, stderr = logs
          NEXT=$(semantic-release version $FLAGS 2>semrel.err) || { cat semrel.err; exit 1; }
          cat semrel.err || true
          NEXT=$(echo "$NEXT" | tail -n1 | tr -d '[:space:]')
          echo "Calculated next version: '$NEXT'"

          if [[ -n "$NEXT" && "$NEXT" != "$CURRENT" ]]; then
            echo "new_version=$NEXT" >> "$GITHUB_OUTPUT"
          else
            echo "new_version=" >> "$GITHUB_OUTPUT"
            echo "ℹ️ No releasable commits since last tag -> no release will be created"
          fi

  build:
    name: Build on ${{ matrix.os }}
    needs: check-commit
    if: needs.check-commit.outputs.should_build == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact_name: TTD-macos
            file_pattern: '*.dmg'
          - os: windows-latest
            artifact_name: TTD-windows
            file_pattern: '*.exe'
          - os: ubuntu-latest
            artifact_name: TTD-linux
            file_pattern: '*.zip'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Resolve build version
        id: version
        shell: bash
        env:
          NEXT: ${{ needs.check-commit.outputs.new_version }}
        run: |
          CURRENT=$(python -c "from version import __version__; print(__version__)")
          VERSION="${NEXT:-$CURRENT}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Current: $CURRENT, building version: $VERSION"

          # Overwrite the whole file (no regex) so it can never end up corrupted
          printf '# baseline version of the package\n__version__ = "%s"\n' "$VERSION" > version.py
          cat version.py
          python -c "from version import __version__; print('Verified:', __version__)"

      - name: Build with PyInstaller
        run: |
          python -m PyInstaller --clean --noconfirm TTD.spec

      - name: Post-build (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          brew install create-dmg
          VERSION="${{ steps.version.outputs.version }}"
          codesign --force --deep --sign - dist/TTD.app
          create-dmg \
            --volname "TTD $VERSION Installer" \
            --window-size 800 400 \
            --icon-size 100 \
            --icon "TTD.app" 200 190 \
            --app-drop-link 600 185 \
            "dist/TTD-$VERSION-macos.dmg" \
            "dist/TTD.app"

      - name: Post-build (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $VERSION = "${{ steps.version.outputs.version }}"
          Write-Host "Listing dist files for verification..."
          if (Test-Path dist) {
              Get-ChildItem -Path dist -Recurse | Select-Object FullName
          }

          $EXE_FILE = Get-ChildItem -Path dist -Filter TTD.exe -Recurse | Select-Object -First 1
          if ($EXE_FILE) {
              $TARGET = "dist/TTD-$VERSION-windows.exe"
              Move-Item -Path $EXE_FILE.FullName -Destination $TARGET -Force
              Write-Host "SUCCESS: Moved to $TARGET"
          } else {
              Write-Error "ERROR: TTD.exe not found in dist directory!"
              exit 1
          }

      - name: Post-build (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          cd dist
          zip -r "TTD-$VERSION-linux.zip" TTD/

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.file_pattern }}
          if-no-files-found: error

  create-release:
    name: Create GitHub Release
    needs: [check-commit, build]
    # Only release when a new version was calculated and every build succeeded
    if: needs.check-commit.outputs.new_version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release files
        run: |
          mkdir -p release-files
          find artifacts -type f \( -name "*.dmg" -o -name "*.exe" -o -name "*.zip" \) -exec cp {} release-files/ \;
          ls -lh release-files/

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install semantic-release
        run: pip install python-semantic-release

      - name: Run semantic-release (stamp version, changelog, commit & tag locally)
        env:
          NEW_VER: ${{ needs.check-commit.outputs.new_version }}
          EVENT: ${{ github.event_name }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -e
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          FLAGS="--no-push --skip-build"
          # Must match the calculation in check-commit
          if [[ "$EVENT" == "workflow_dispatch" ]]; then
            FLAGS="--patch $FLAGS"
          fi
          semantic-release version $FLAGS

          # Make sure the tag PSR created matches what we built and named the files with
          git rev-parse "v${NEW_VER}" >/dev/null

          git push origin "HEAD:${BRANCH}"
          git push origin "v${NEW_VER}"

      - name: Generate release notes markdown
        env:
          NEW_VER: ${{ needs.check-commit.outputs.new_version }}
        run: |
          cat > release_notes.md << EOF
          ## Changes (v${NEW_VER})

          Please see CHANGELOG.md for full commit history.

          ## 📦 Downloads
          - **macOS**: TTD-${NEW_VER}-macos.dmg
          - **Windows**: TTD-${NEW_VER}-windows.exe
          - **Linux**: TTD-${NEW_VER}-linux.zip

          ---
          *Auto-generated release from GitHub Actions*
          EOF
          cat release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.check-commit.outputs.new_version }}
          name: TTD v${{ needs.check-commit.outputs.new_version }}
          body_path: release_notes.md
          files: release-files/*
          draft: false
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }}