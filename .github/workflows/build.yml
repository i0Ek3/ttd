name: Package TTD
on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  check-commit:
    name: Check Commit Message & Calc SemVer
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
      commit_message: ${{ steps.check.outputs.commit_message }}
      new_version: ${{ steps.semver.outputs.new_version }}
      current_version: ${{ steps.semver.outputs.current_version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true # 允许后续提交tag/版本文件

      - name: Check commit message
        id: check
        run: |
          COMMIT_MSG="${{ github.event.head_commit.message }}"
          echo "Commit message: $COMMIT_MSG"

          # 发版机器人自己推送的 version bump 提交不应再触发一轮构建
          if [[ "$COMMIT_MSG" == chore\(release\)* ]]; then
            echo "should_build=false" >> $GITHUB_OUTPUT
            echo "⏭️ Skipping: release commit pushed by the bot itself"
          # 支持 feat(lib): / fix(core): / chore(ci):
          elif [[ "$COMMIT_MSG" =~ ^(feat|fix|chore) ]] || [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "should_build=true" >> $GITHUB_OUTPUT
            echo "✅ Build triggered: commit message matches pattern or manual trigger"
          else
            echo "should_build=false" >> $GITHUB_OUTPUT
            echo "⏭️ Skipping build: commit message doesn't match conventional commits"
          fi

          echo "commit_message<<EOF" >> $GITHUB_OUTPUT
          echo "$COMMIT_MSG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Set up Python
        if: steps.check.outputs.should_build == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install python-semantic-release
        if: steps.check.outputs.should_build == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install python-semantic-release

      - name: Calculate next semantic version
        id: semver
        if: steps.check.outputs.should_build == 'true'
        shell: bash
        run: |
          set -e  # 不再吞错：版本计算失败时让本步骤直接失败，避免静默跳过 release
          CURRENT=$(python -c "from version import __version__; print(__version__)")
          echo "current_version=$CURRENT" >> $GITHUB_OUTPUT
          echo "Current baseline version: $CURRENT"

          # 新版 PSR 用 `version --print` 计算下一个版本（旧的 print-version 子命令
          # 已废弃/移除，且 --no-vcs-release 只是 version 子命令的选项）。
          # --print 只输出结果、不做任何修改；无版本变更时会打印当前版本，
          # 所以与 CURRENT 比较即可判断是否需要发版。
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            # 手动触发时强制 patch 升级，否则纯 chore 提交手动触发也算不出新版本
            NEXT=$(semantic-release version --patch --print --no-commit --no-tag --no-changelog --no-vcs-release --skip-build)
          else
            NEXT=$(semantic-release version --print --no-commit --no-tag --no-changelog --no-vcs-release --skip-build)
          fi
          echo "Calculated next version: '$NEXT'"

          if [[ -n "$NEXT" && "$NEXT" != "$CURRENT" ]]; then
            echo "new_version=$NEXT" >> $GITHUB_OUTPUT
          else
            echo "new_version=" >> $GITHUB_OUTPUT
          fi

  build:
    name: Build on ${{ matrix.os }}
    needs: check-commit
    if: needs.check-commit.outputs.should_build == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: macos-latest
            artifact_name: TTD-macos
            file_pattern: '*.dmg'
          - os: windows-latest
            artifact_name: TTD-windows
            file_pattern: '*.exe'
          - os: ubuntu-latest
            artifact_name: TTD-linux
            file_pattern: '*.zip'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Resolve build version
        id: version
        shell: bash
        run: |
          # Use the version that the release will be tagged with, so that the app,
          # the file names and the GitHub release all show the same number.
          # Without a version bump (e.g. chore commits) fall back to the current one.
          CURRENT=$(python -c "from version import __version__; print(__version__)")
          NEXT="${{ needs.check-commit.outputs.new_version }}"
          VERSION="${NEXT:-$CURRENT}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Current: $CURRENT, building version: $VERSION"

          # Bake it into version.py before PyInstaller runs (shown in the window title)
          VERSION="$VERSION" python - <<'PY'
          import os, re, pathlib
          version = os.environ["VERSION"]
          path = pathlib.Path("version.py")
          text = path.read_text(encoding="utf-8")
          new_text, count = re.subn(
              r"^__version__\s*=\s*['\"[^'\"]*['\"]",
              f'__version__ = "{version}"',
              text,
              flags=re.M,
          )
          if count == 0:
              new_text = text.rstrip("\n") + f'\n__version__ = "{version}"\n'
          path.write_text(new_text, encoding="utf-8")
          print(new_text)
          PY

      - name: Build with PyInstaller
        run: |
          python -m PyInstaller --clean --noconfirm TTD.spec

      - name: Post-build (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          brew install create-dmg
          VERSION="${{ steps.version.outputs.version }}"
          codesign --force --deep --sign - dist/TTD.app
          create-dmg             --volname "TTD $VERSION Installer"             --window-size 800 400             --icon-size 100             --icon "TTD.app" 200 190             --app-drop-link 600 185             "dist/TTD-$VERSION-macos.dmg"             "dist/TTD.app"

      - name: Post-build (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          $VERSION = "${{ steps.version.outputs.version }}"
          Write-Host "Listing dist files for verification..."
          if (Test-Path dist) {
              Get-ChildItem -Path dist -Recurse | Select-Object FullName
          }

          Write-Host "Searching for TTD.exe..."
          $EXE_FILE = Get-ChildItem -Path dist -Filter TTD.exe -Recurse | Select-Object -First 1

          if ($EXE_FILE) {
              Write-Host "FOUND: $($EXE_FILE.FullName)"
              $TARGET = "dist/TTD-$VERSION-windows.exe"
              Move-Item -Path $EXE_FILE.FullName -Destination $TARGET -Force
              Write-Host "SUCCESS: Moved to $TARGET"
          } else {
              Write-Error "ERROR: TTD.exe not found in dist directory!"
              exit 1
          }

      - name: Post-build (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          cd dist
          zip -r "TTD-$VERSION-linux.zip" TTD/
          cd ..

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.file_pattern }}
          if-no-files-found: error

  create-release:
    name: Create GitHub Release
    needs: [check-commit, build]
    # 关键条件：只有算出新版本才执行release；chore无版本变更直接跳过
    if: needs.check-commit.outputs.new_version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display structure of downloaded files
        run: |
          echo "📦 Downloaded artifacts:"
          ls -R artifacts/

      - name: Prepare release files
        run: |
          mkdir -p release-files
          find artifacts -type f \( -name "*.dmg" -o -name "*.exe" -o -name "*.zip" \) -exec cp {} release-files/ \;
          echo "📁 Files to be released:"
          ls -lh release-files/

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install semantic-release
        run: |
          pip install python-semantic-release

      - name: Run semantic-release (stamp version, changelog, commit & tag locally)
        id: semrel
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # commit_version_number = true：该命令一次性完成
          # 写入 version.py → 更新 CHANGELOG.md → 创建 release 提交 → 打 tag（均在本地）。
          # --no-push 只做到本地为止，推送交给下面两步；
          # --skip-build 因为本项目用 PyInstaller 打包，而非 python -m build。
          semantic-release version --no-push --skip-build

          NEW_VER="${{ needs.check-commit.outputs.new_version }}"
          git push origin HEAD:${{ github.ref_name }}
          git push origin "v${NEW_VER}"

      - name: Generate release notes markdown
        id: release_notes
        env:
          NEW_VER: ${{ needs.check-commit.outputs.new_version }}
        run: |
          cat > release_notes.md << EOF
          ## Changes (v${NEW_VER})

          Please see CHANGELOG.md for full commit history.

          ## 📦 Downloads
          - **macOS**: TTD-${NEW_VER}-macos.dmg
          - **Windows**: TTD-${NEW_VER}-windows.exe
          - **Linux**: TTD-${NEW_VER}-linux.zip

          ---
          *Auto-generated release from GitHub Actions*
          EOF
          cat release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.check-commit.outputs.new_version }}
          name: TTD v${{ needs.check-commit.outputs.new_version }}
          body_path: release_notes.md
          files: release-files/*
          draft: false
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }}
